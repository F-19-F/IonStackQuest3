name: Generate IonStack Config

on:
  workflow_dispatch:
    inputs:
      incremental:
        description: 'Quest 3 firmware incremental number'
        required: true
        default: '52345320035400520'

      base_address:
        description: 'kimage_text_base (ARM64 kernel base address)'
        required: false
        default: '0xFFFFFFC008000000'

      boot_partition:
        description: 'Partition name in payload.bin (boot / init_boot)'
        required: false
        default: 'boot'

      magisk_url:
        description: 'Magisk APK URL'
        required: false
        default: 'https://github.com/topjohnwu/Magisk/releases/latest/download/app-debug.apk'


jobs:
  generate-config:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Install Python dependencies
        run: pip install vmlinux-to-elf pyelftools


      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full xxd 2>/dev/null || true


      - name: Download Magisk and extract magiskboot
        run: |
          MAGISK_URL="${{ inputs.magisk_url }}"

          if [ -z "$MAGISK_URL" ]; then
            MAGISK_URL="https://github.com/topjohnwu/Magisk/releases/latest/download/app-debug.apk"
          fi

          echo "[*] Downloading Magisk from: $MAGISK_URL"

          wget -nv -O magisk.apk "$MAGISK_URL"

          unzip -o -j magisk.apk 'lib/x86_64/libmagiskboot.so' -d .

          chmod +x libmagiskboot.so

          echo "[*] magiskboot version:"
          ./libmagiskboot.so 2>&1 | head -3

          rm -f magisk.apk


      - name: Download ROM
        run: |
          INCREMENTAL="${{ inputs.incremental }}"

          ROM_URL="https://files.cocaine.trade/firmware/meta/Quest%203/q3_${INCREMENTAL}.zip"

          echo "[*] Downloading:"
          echo "$ROM_URL"

          wget -nv -O "rom.ext" "$ROM_URL"

          ls -lh rom.ext

          MAGIC=$(xxd -l 4 -p rom.ext)

          case "$MAGIC" in
            504b0304)
              mv rom.ext rom.zip
              echo "RENAMED_FILE=rom.zip" >> $GITHUB_ENV
              ;;

            1f8b*)
              mv rom.ext rom.tar.gz
              echo "RENAMED_FILE=rom.tar.gz" >> $GITHUB_ENV
              ;;

            *)
              echo "[!] Unknown file type"
              exit 1
              ;;
          esac


      - name: Extract ROM
        run: |
          mkdir -p rom_out

          case "${RENAMED_FILE}" in
            *.zip)
              unzip -o rom.zip -d rom_out
              ;;

            *.tar.gz)
              tar xzf rom.tar.gz -C rom_out
              ;;
          esac


      - name: Extract boot.img
        id: bootimg
        run: |
          BOOT_PART="${{ inputs.boot_partition }}"

          PAYLOAD=$(find rom_out -name payload.bin | head -1)

          if [ -n "$PAYLOAD" ]; then
            echo "[*] Found payload.bin"

            ./libmagiskboot.so extract "$PAYLOAD" "$BOOT_PART" boot.img

          else

            BOOT_IMG=$(find rom_out -name boot.img | head -1)

            if [ -n "$BOOT_IMG" ]; then
              cp "$BOOT_IMG" boot.img
            else
              echo "[!] boot.img not found"
              exit 1
            fi

          fi
