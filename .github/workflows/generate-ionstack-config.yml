name: Generate IonStack Config

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Quest 3 firmware URL (.zip / .tar.gz / payload.bin / boot.img)'
        required: true
        default: 'https://files.cocaine.trade/firmware/meta/Quest%203/q3_52345320035400520.zip'

      base_address:
        description: 'kimage_text_base (ARM64 kernel base address)'
        required: false
        default: '0xFFFFFFC008000000'

      boot_partition:
        description: 'Partition name in payload.bin (boot / init_boot)'
        required: false
        default: 'boot'

      magisk_url:
        description: 'Magisk APK URL'
        required: false
        default: 'https://github.com/topjohnwu/Magisk/releases/latest/download/app-debug.apk'


jobs:
  generate-config:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Install Python dependencies
        run: pip install vmlinux-to-elf pyelftools


      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full xxd 2>/dev/null || true


      - name: Download Magisk and extract magiskboot
        run: |
          MAGISK_URL="${{ inputs.magisk_url }}"

          if [ -z "$MAGISK_URL" ]; then
            MAGISK_URL="https://github.com/topjohnwu/Magisk/releases/latest/download/app-debug.apk"
          fi

          echo "[*] Downloading Magisk from: $MAGISK_URL"

          wget -nv -O magisk.apk "$MAGISK_URL"

          unzip -o -j magisk.apk 'lib/x86_64/libmagiskboot.so' -d .

          chmod +x libmagiskboot.so

          ./libmagiskboot.so 2>&1 | head -3

          rm -f magisk.apk


      - name: Download ROM
        run: |
          ROM_URL="${{ inputs.rom_url }}"

          echo "[*] Downloading: $ROM_URL"

          wget -nv -O "rom.ext" "$ROM_URL"

          ls -lh rom.ext

          file="./rom.ext"

          if [ ! -f "$file" ]; then
            echo "File not found"
            exit 1
          fi


          MAGIC=$(xxd -l 4 -p "$file")

          case "$MAGIC" in

            504b0304)
              new_name="${file%.*}.zip"
              echo "Detected ZIP"
              mv -n "$file" "$new_name"
              echo "RENAMED_FILE=$new_name" >> $GITHUB_ENV
              exit 0
              ;;

            1f8b*)
              new_name="${file%.*}.tar.gz"
              echo "Detected GZIP"
              mv -n "$file" "$new_name"
              echo "RENAMED_FILE=$new_name" >> $GITHUB_ENV
              exit 0
              ;;

          esac


          if ./libmagiskboot.so extract "$file" >/dev/null 2>&1; then

            echo "Valid payload.bin"

            mv "$file" payload.bin

            echo "RENAMED_FILE=payload.bin" >> $GITHUB_ENV

          else

            MAGIC=$(xxd -l 8 -p "$file")

            if [ "$MAGIC" = "414e44524f494421" ]; then

              echo "Valid boot.img"

              mv "$file" boot.img

              echo "RENAMED_FILE=boot.img" >> $GITHUB_ENV

            else

              echo "[!] Invalid file"
              exit 1

            fi

          fi
