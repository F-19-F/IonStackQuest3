name: Generate IonStack Config

on:
  workflow_dispatch:
    inputs:
      incremental:
        description: 'Quest 3 firmware incremental number'
        required: true
        default: '52345320035400520'

      base_address:
        description: 'kimage_text_base (ARM64 kernel base address)'
        required: false
        default: '0xFFFFFFC008000000'

      boot_partition:
        description: 'Partition name in payload.bin (boot / init_boot)'
        required: false
        default: 'boot'

      magisk_url:
        description: 'Magisk APK URL'
        required: false
        default: 'https://github.com/topjohnwu/Magisk/releases/latest/download/app-debug.apk'

jobs:
  generate-config:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install vmlinux-to-elf pyelftools

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full xxd

      - name: Download Magisk and extract magiskboot
        run: |
          wget -nv -O magisk.apk "${{ inputs.magisk_url }}"
          unzip -o -j magisk.apk 'lib/x86_64/libmagiskboot.so' -d .
          chmod +x libmagiskboot.so
          rm -f magisk.apk

      - name: Download ROM
        run: |
          URL="https://files.cocaine.trade/firmware/meta/Quest%203/q3_${{ inputs.incremental }}.zip"

          echo "$URL"

          wget -nv -O rom.zip "$URL"

          ls -lh rom.zip

      - name: Upload firmware ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Quest3-Firmware-${{ inputs.incremental }}
          path: rom.zip

      - name: Extract ROM
        run: |
          mkdir -p rom_out
          unzip -o rom.zip -d rom_out

      - name: Extract boot.img
        run: |
          PAYLOAD=$(find rom_out -name payload.bin | head -1)

          if [ -n "$PAYLOAD" ]; then
            ./libmagiskboot.so extract "$PAYLOAD" "${{ inputs.boot_partition }}" boot.img
          else
            BOOT_IMG=$(find rom_out -name boot.img | head -1)
            [ -n "$BOOT_IMG" ] && cp "$BOOT_IMG" boot.img
          fi

          ls -lh boot.img
